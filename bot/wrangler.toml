name = "accesspoint-bot"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Create once with: wrangler kv namespace create AP_KV   (then paste the id here)
[[kv_namespaces]]
binding = "AP_KV"
id = "e40298d1713b4d44b41007ed063bdec7"

[observability]
enabled = true

# /try web console: at most 10 requests per minute per visitor (protects the model credits)
[[ratelimits]]
name = "TRY_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
