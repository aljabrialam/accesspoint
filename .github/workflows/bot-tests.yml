name: bot tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bot tests (22) and syntax checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Unit and end-to-end tests (Meta APIs mocked)
        working-directory: bot
        run: npm test
      - name: Syntax check every bot source file
        run: for f in bot/src/*.js bot/scripts/*.mjs; do node --check "$f"; done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Syntax check the audio service
        run: python -m py_compile bot/modal/audio.py
