appId: host.exp.Exponent
---
- runFlow: ../../mobile/.maestro/subflows/close-open-guide.yaml
- openLink: exp://127.0.0.1:8081/--/guide/atm
- extendedWaitUntil:
    visible: "I can see an ATM."
    timeout: 20000
- waitForAnimationToEnd
- tapOn: { id: "action-Card is in" }
- waitForAnimationToEnd
- tapOn: { id: "action-Savings" }
- waitForAnimationToEnd
